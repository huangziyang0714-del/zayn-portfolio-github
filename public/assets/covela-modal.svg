<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1000" role="img" aria-labelledby="title desc">
  <title id="title">COVELA portrait project poster</title>
  <desc id="desc">A portrait COVELA wordmark poster designed for the project modal.</desc>
  <defs>
    <pattern id="covela-modal-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#20231f" stroke-opacity=".075" />
    </pattern>
  </defs>
  <rect width="780" height="1000" fill="#f2f0eb" />
  <rect width="780" height="1000" fill="url(#covela-modal-grid)" opacity=".5" />
  <circle cx="640" cy="800" r="170" fill="none" stroke="#e85752" stroke-width="2" stroke-opacity=".24" />
  <circle cx="640" cy="800" r="128" fill="none" stroke="#e85752" stroke-width="2" stroke-opacity=".16" />
  <path d="M64 126H716M64 874H716" stroke="#20231f" stroke-opacity=".28" />
  <path d="M64 146H182M598 854H716" stroke="#e85752" stroke-width="6" />
