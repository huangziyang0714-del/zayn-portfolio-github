  <text x="390" y="580" fill="#20231f" font-family="Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">SUN READY. PET APPROVED.</text>
  <rect x="340" y="614" width="100" height="7" fill="#e85752" />
