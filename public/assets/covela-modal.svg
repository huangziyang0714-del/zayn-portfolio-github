  <text x="64" y="930" fill="#20231f" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">A QUIET LAYER FOR LONGER DAYS</text>
  <text x="716" y="930" fill="#e85752" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="2">COVELA / 2026</text>
