  <rect x="42" y="42" width="836" height="916" fill="none" stroke="#f5dce3" stroke-opacity=".32"/>

  <path d="M72 184H848" stroke="#f5dce3" stroke-opacity=".2"/>
  <path d="M72 816H848" stroke="#f5dce3" stroke-opacity=".2"/>
  <path d="M72 206H268M652 206H848" stroke="#d31345" stroke-width="5"/>

  <g fill="#f8e7eb" font-family="Arial, Helvetica, sans-serif" letter-spacing="4">
    <text x="72" y="92" font-size="17" font-weight="700">MCYH / BRAND SYSTEM</text>
    <text x="72" y="120" font-size="11" opacity=".64">MATERIAL TECHNOLOGY / 2026</text>
    <text x="738" y="120" font-size="13" opacity=".72">02 / 08</text>
  </g>

  <rect x="54" y="252" width="812" height="470" fill="#09090c" fill-opacity=".7" stroke="#d31345" stroke-opacity=".54"/>
  <rect x="72" y="270" width="776" height="434" fill="none" stroke="#f5dce3" stroke-opacity=".13"/>
  <path d="M84 290H238M682 684H836" stroke="#d31345" stroke-width="7"/>
  <path d="M72 738H848" stroke="#f5dce3" stroke-opacity=".18"/>

  <g fill="#f8e7eb" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">
    <text x="72" y="866" font-size="17" font-weight="700">MCYH / PROFESSIONAL GROUT</text>
    <text x="72" y="894" font-size="11" opacity=".64">MATERIAL TECHNOLOGY / SHANGHAI</text>
    <text x="848" y="894" font-size="11" opacity=".64" text-anchor="end">BRAND WEBSITE / 2026</text>
  </g>
  <path d="M72 932H848" stroke="#d31345" stroke-opacity=".55"/>
