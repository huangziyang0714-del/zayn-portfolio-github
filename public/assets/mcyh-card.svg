<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1000" role="img" aria-labelledby="title desc">
  <title id="title">MCYH 美瓷壹号 brand poster</title>
  <desc id="desc">A portrait burgundy and graphite brand poster with a protected central logo zone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a15"/>
      <stop offset="0.5" stop-color="#110a11"/>
      <stop offset="1" stop-color="#3d0d20"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#971437" stop-opacity=".38"/>
      <stop offset=".64" stop-color="#4a0d24" stop-opacity=".12"/>
      <stop offset="1" stop-color="#110a11" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V32M16 0V32" stroke="#f8e8ed" stroke-opacity=".075"/>
    </pattern>
  </defs>

  <rect width="920" height="1000" fill="url(#bg)"/>
  <rect width="920" height="1000" fill="url(#glow)"/>
