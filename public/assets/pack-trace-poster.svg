<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">PACK TRACE logo poster</title>
  <desc id="desc">A dark technical poster for the Pack Trace outdoor pet equipment brand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11140f" />
      <stop offset="0.55" stop-color="#26301d" />
      <stop offset="1" stop-color="#080a08" />
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#eff0e9" stroke-opacity=".12" />
    </pattern>
    <radialGradient id="halo" cx="75%" cy="23%" r="60%">
      <stop offset="0" stop-color="#c8ff1a" stop-opacity=".24" />
      <stop offset="1" stop-color="#c8ff1a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)" />
  <rect width="1200" height="1500" fill="url(#halo)" />
  <rect width="1200" height="1500" fill="url(#grid)" opacity=".6" />
  <path d="M80 180H1120M80 1280H1120" stroke="#eff0e9" stroke-opacity=".34" />
  <text x="80" y="112" fill="#c8ff1a" font-family="Arial Black, Arial, sans-serif" font-size="24" letter-spacing="5">TUOJI SYSTEM / 01</text>
  <text x="1120" y="112" fill="#eff0e9" fill-opacity=".78" text-anchor="end" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">FIELD EQUIPMENT / 2026</text>
  <g transform="translate(100 430) scale(3)">
    <rect width="100" height="100" fill="#151713" />
    <path d="M18 78V58L44 32H78V48H52V78H82" fill="none" stroke="#c8ff1a" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" />
  </g>
  <path d="M440 390V870" stroke="#c8ff1a" stroke-opacity=".72" />
  <text x="520" y="545" fill="#c8ff1a" font-family="Impact, Arial Black, sans-serif" font-size="154" letter-spacing="-2">PACK</text>
  <text x="520" y="685" fill="#c8ff1a" font-family="Impact, Arial Black, sans-serif" font-size="154" letter-spacing="-2">TRACE</text>
  <rect x="100" y="735" width="300" height="2" fill="#c8ff1a" />
  <text x="100" y="785" fill="#eff0e9" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">BRAND SYMBOL / TUOJI</text>
  <text x="100" y="930" fill="#eff0e9" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">MOVE FURTHER.</text>
  <text x="100" y="980" fill="#eff0e9" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">STAY CONNECTED.</text>
  <text x="1120" y="1415" fill="#c8ff1a" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">01 / 08</text>
</svg>
